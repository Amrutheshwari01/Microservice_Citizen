services:
  cis-dev-db:
    profiles:
      - dev
    image: postgres:16
    container_name: agrilink-cis-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cis_dev
      POSTGRES_USER: cis_dev
      POSTGRES_PASSWORD: ${CIS_DEV_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cis_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cis_dev -d cis_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - agrilink-net

  # ── Citizen Identity & Wallet API ────────────────────────────────────────
  cis-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CIS_IMAGE:-agrilink-cis:latest}
    container_name: agrilink-cis-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env                  # All secrets live in .env – never hardcode here
    environment:
      - DEBUG=false
    command:
      - sh
      - -c
      - "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --access-log"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - agrilink-net

networks:
  agrilink-net:
    name: agrilink-network
    driver: bridge

volumes:
  cis_dev_data:
    name: cis_dev_data

# ── Notes ──────────────────────────────────────────────────────────────────
# 1. Local PostgreSQL is opt-in via --profile dev; production uses DATABASE_URL from .env.
# 2. To start in development mode:
#      docker compose up --build
# 3. To run with hot-reload locally (without Docker):
#      .venv311\Scripts\uvicorn app.main:app --reload --port 8000
# 4. For production deployment to AWS ECS, reference .env values from
#    AWS Secrets Manager or SSM Parameter Store – never bake secrets into images.
