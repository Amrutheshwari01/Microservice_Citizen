
name: Citizen Identity Service CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cis
          POSTGRES_PASSWORD: cis
          POSTGRES_DB: cis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cis -d cis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://cis:cis@localhost:5432/cis_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production-123456
      INTERNAL_SERVICE_SECRET: ci-only-internal-service-secret
      DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Create test database schema
        run: python -c "from app.db.database import engine; from app.models import Base; Base.metadata.create_all(bind=engine)"

      - name: Lint with Ruff
        run: python -m ruff check app/ tests/ --isolated --select E4,E7,E9,F --output-format=github

      - name: Format check with Black
        run: python -m black --check app/ tests/

      - name: Run tests
        run: python -m pytest -v tests/ --tb=short

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: agrilink-cis:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [test, docker-build]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to AWS EC2"

            cd ~/Microservice_Citizen

            echo "Pulling latest code..."
            git pull --ff-only origin main

            cd backend

            echo "Building Docker container..."
            docker compose build cis-api

            echo "Starting application..."
            docker compose up -d cis-api

            echo "Checking container status..."
            docker compose ps

            echo "Checking application health..."
            curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8000/health

            echo "AWS DEPLOYMENT SUCCESSFUL"
