
name: Citizen Identity Service CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cis
          POSTGRES_PASSWORD: cis
          POSTGRES_DB: cis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cis -d cis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://cis:cis@localhost:5432/cis_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production-123456
      INTERNAL_SERVICE_SECRET: ci-only-internal-service-secret
      DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Apply test database migrations
        run: python -m alembic upgrade head

      - name: Lint with Ruff
        run: python -m ruff check app/ tests/ --isolated --select E4,E7,E9,F --output-format=github

      - name: Format check with Black
        run: python -m black --check app/ tests/

      - name: Run tests
        run: python -m pytest -v tests/ --tb=short

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: agrilink-cis:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: agrilink-citizen-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [frontend, test, docker-build]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check EC2 deployment secrets
        id: ec2_config
        shell: bash
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_USER" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS deployment skipped; configure EC2_HOST, EC2_USER, and EC2_SSH_KEY."
            echo "Set EC2_HOST, EC2_USER, and EC2_SSH_KEY repository Actions secrets to enable backend deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy application to EC2
        if: steps.ec2_config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to AWS EC2"

            cd ~/Microservice_Citizen

            echo "Pulling latest code..."
            git rev-parse HEAD > /tmp/cis_previous_commit
            git pull --ff-only origin main

            cd backend

            PREVIOUS_SHA="$(cat /tmp/cis_previous_commit)"
            ROLLBACK_IMAGE="agrilink-cis:${PREVIOUS_SHA}"
            ROLLBACK_FRONTEND_IMAGE="agrilink-cis-frontend:${PREVIOUS_SHA}"
            export ROLLBACK_IMAGE
            export ROLLBACK_FRONTEND_IMAGE
            sh ./scripts/deploy.sh "$(git rev-parse HEAD)"

            echo "AWS DEPLOYMENT SUCCESSFUL"
